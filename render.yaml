# Render.com blueprint. Deploy with: New -> Blueprint -> point at this repo.
#
# The critical piece is the Dockerfile: Render's default Node runtime has no
# yt-dlp, and the pure-JS fallback cannot play anything. Building the image
# bakes the binary in.
# NOTE: this blueprint builds with Docker (see Dockerfile).
#
# If your service already exists as a plain "Web Service" on the Node runtime,
# Render IGNORES the Dockerfile and uses its own Node image, which has no
# yt-dlp - that is what produces "No stream available". Two ways out:
#
#   1. Recommended: delete the service and redeploy as a Blueprint so this file
#      is applied, or in the dashboard set Runtime -> Docker and point at
#      ./Dockerfile.
#   2. Or stay on the Node runtime: the app self-provisions yt-dlp at boot via
#      server/install.js (it downloads the binary into ./bin). This works, it is
#      just slower on first boot.
services:
  - type: web
    name: cyberstream
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # a free instance may be throttled or idle out
    healthCheckPath: /api/health
    # YouTube rate-limits aggressively from shared/datacenter IPs.
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5173
      - key: HOST
        value: 0.0.0.0
      - key: MAX_QUALITY
        value: 1080
      - key: CACHE_TTL_MS
        value: 300000
      - key: UPSTREAM_TIMEOUT_MS
        value: 20000
      - key: PROXY_TIMEOUT_MS
        value: 120000
      - key: YTDLP_PATH
        value: /app/bin/yt-dlp
      # Set this in the Render dashboard. Without it, proxy links are only
      # valid until the container restarts.
      - key: PROXY_SECRET
        generateValue: true
      # Optional. Needed for age-gated or region-locked videos.
      # - key: YTDLP_COOKIES_FROM_BROWSER
      #   sync: false